<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      .hide{display: none;}
    </style>
  </head>
  <body>
    <main>
      <form id="data" class="hide">
        <h3>Some Content</h3>      
      </form>

      <!-- LOGIN WINDOW-->
      <dialog id="login-modal">
        <form method="dialog">
          <input type="email" name="email" placeholder="email" required autocomplete="email">
          <input type="password" name="password" placeholder="senha" required autocomplete="current-password">
          <div class="actions">
            <button type="button" class="botCancel" onclick="this.closest('dialog').close()">Cancelar</button>
            <button type="submit" class="botLogin" onclick="appInit">Entrar</button>
          </div>
        </form>
      </dialog>
    </main>
    <script>

      async function loadLogin()
      {
        document.getElementById('login-modal').showModal();
      }

      async function appInit(event)
      {
        event.preventDefault(); 
        const formData = new FormData(event.target);
        const credentials = Object.fromEntries(formData.entries());

        if (!credentials.email || !credentials.password) return;
  
        const { data, error } = await dbClient.auth.signInWithPassword(credentials);
  
        if (error)
        {
          alert(`Login failed: ${error.message}`);
        }
        else
        {
          alert("login ok");
          setupSession(data.user);
          event.target.closest('dialog').close(); 
        }
      }
      window.addEventListener('DOMContentLoaded', loadLogin)
    </script>
  
  </body>
</html>
