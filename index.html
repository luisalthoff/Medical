<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="jcpf">

    <title>JCPF</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="img/logo-192.png">
    <link rel="apple-touch-icon" href="img/logo-192.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
  </head>

  <body>
    <main id="main">
      <img class="logo" src="img/jcpf.svg">
      <button id="botao">Mostra/Esconde</button>

      <!-- ADMIN -->
      <form id="admin" class="esconde">
        <h3>Gestão de Pacientes</h3>
        <select id="pacientesList">
          <option value="">Pacientes...</option>
        </select>
        <select id="medicacaoList">
          <option value="">Medicamentos...</option>
        </select>          
      
        <input type="text" id="dosage" placeholder="Dosagem (e.g. 100mg)">
        <input type="number" id="duration" placeholder="Duração em dias">
        <button onclick="createSpreadsheet()">Gerar Planilha</button>
      </form>

      <!-- PACIENTES -->
      <form id="patient" class="esconde">
        <h3>📋 Meus Medicamentos</h3>
        <div id="prescriptionList">Loading prescriptions...</div>

        <h3 style="margin-top: 24px;">📊 Log Vitals (Optional)</h3>
        <input type="text" id="bpInput" placeholder="Blood Pressure (e.g., 120/80)">
        <input type="number" step="0.1" id="tempInput" placeholder="Temperature (°C)">
      </form>
    </main>

    <!-- LOGIN WINDOW-->
    <dialog id="login-modal">
      <form method="dialog">
        <input type="email" name="email" placeholder="email" required autocomplete="email">
        <input type="password" name="password" placeholder="senha" required autocomplete="current-password">
        <div class="actions">
          <button type="button" class="botCancel" onclick="this.closest('dialog').close()">Cancelar</button>
          <button type="submit" class="botLogin">Entrar</button>
        </div>
      </form>
    </dialog>
    <!-- login window-->
       
    <script>
      window.addEventListener('DOMContentLoaded', appInit)
    </script>
  
  </body>
</html>
