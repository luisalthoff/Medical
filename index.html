<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="jcpf">

    <title>JCPF</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="img/logo-192.png">
    <link rel="apple-touch-icon" href="img/logo-192.png">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <main id="app">
      <img class="logo" src="img/jcpf.svg">
    </main>

    <!-- LOGIN WINDOW-->
    <dialog id="login-modal">
      <form method="dialog">
        <input type="email" placeholder="Usuário" required autocomplete="username">
        <input type="password" placeholder="Senha" required autocomplete="current-password">
        <div class="actions">
          <button type="button" class="botCancel" onclick="this.closest('dialog').close()">Cancelar</button>
          <button type="submit" class="botLogin">Login</button>
        </div>
      </form>
    </dialog>
    <!-- login window-->
       
    <script src="js/login.js"></script>
    <script src="js/app.js"></script>

    <script>
      window.addEventListener('DOMContentLoaded', appInit)
    </script>
  
  </body>
</html>
